services:
  localstack:
    image: localstack/localstack:latest
    container_name: harbor-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - AWS_DEFAULT_REGION=us-east-1
      - EXTRA_CORS_ALLOWED_ORIGINS=*
    volumes:
      - localstack_data:/var/lib/localstack
      - ../bootstrap/localstack/01-init-s3.sh:/etc/localstack/init/ready.d/01-init-s3.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4566/_localstack/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - harbor-net

volumes:
  localstack_data:

networks:
  harbor-net:
    driver: bridge
