services:
  minio:
    image: minio/minio:RELEASE.2024-05-28T07-15-04Z
    container_name: harbor-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: harbor_admin
      MINIO_ROOT_PASSWORD: harbor_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - harbor-net

  minio-init:
    image: minio/mc:latest
    container_name: harbor-minio-init
    entrypoint: /bin/sh
    command: /scripts/01-init-buckets.sh
    volumes:
      - ../bootstrap/minio/01-init-buckets.sh:/scripts/01-init-buckets.sh:ro
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - harbor-net

volumes:
  minio_data:

networks:
  harbor-net:
    driver: bridge
