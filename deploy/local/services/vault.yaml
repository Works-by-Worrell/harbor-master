services:
  vault:
    image: hashicorp/vault:1.16
    container_name: harbor-vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: harbor-vault-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    cap_add:
      - IPC_LOCK
    volumes:
      - ../bootstrap/vault/01-init-secrets.sh:/vault/init/01-init-secrets.sh:ro
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - harbor-net

networks:
  harbor-net:
    driver: bridge
